
<div class="container-fluid">
    <div class="row">
      <!-- Left Column - Overlay -->
      <div class="col-lg-6 bg-dark d-flex align-items-center justify-content-center text-white overlay">
      
      </div>
  
      <!-- Right Column - Form -->
      <div class="col-lg-6 col-md-12 form-container">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title text-center">Email Verification</h2>
            <p class="mb-0 text-center text-muted">We have sent code to your email.</p>
            
            
              
              <div class="form-group">
                <mat-form-field class="example-full-width">
                    <mat-label>Confirm Pin</mat-label>
                    <input matInput type="number" [(ngModel)]="userPin">
                  </mat-form-field>
              </div>
             
              <div class="d-flex justify-content-end">
                  <button mat-raised-button color="primary" type="submit" (click)="verifyEmail()">Confirm</button>

              </div>
              <!-- <div *ngIf=" loading " class="d-flex justify-content-center">
                <div class="spinner-border text-secondary " role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>

              </div> -->
            
     
      
          </div>
        </div>
      </div>
    </div>
  </div>
