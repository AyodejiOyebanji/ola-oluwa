<div class="container-fluid pt-4 px-4">
  <div class="row g-4">
    <!-- All product Start -->
    <div class="container-fluid pt-4 px-4">
      <div class="smato-page-card">
        <div class="smato-page-header">
          <h1 class="smato-page-title">Wallets</h1>
          <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search..."
          class="form-control smato-search"
          (input)="search()"
        />
        
        </div>
        <h2 style="font-weight: 700" class="text-muted text-end">
          ₦{{ totalWallet }}:00
        </h2>
        <div class="table-responsive mt-3">
          <table
            class="smato-table"
          >
            <thead>
              <tr>
                <th scope="col">S/N</th>
                <th scope="col">Name of Customer</th>
                <th scope="col">Amount</th>
                <th scope="col">Remark</th>
                <th scope="col">Date</th>
                <th scope="col">Action</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngIf="filteredWallets?.length; else noProducts">
                <tr *ngFor="let wallet of filteredWallets; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ wallet.customername }}</td>
                  <td>₦{{ wallet.outstandingAmount }}:00</td>

                  <td>
                    {{ wallet.remark }}
                  </td>
                  <td>{{ wallet.createdAt | date : "medium" }}</td>

                  <td>
                    <a
                      class="btn btn-sm btn-primary w-100"
                      (click)="viewItem(wallet._id)"
                      data-bs-toggle="modal"
                      data-bs-target="#staticBackdropEdit"
                      >View</a
                    >
                  </td>
                  <td   *ngIf="currentUserDetails?.role == 'Admin'">
                    <a
                      class="btn btn-sm btn-danger w-100"
                      (click)="deleteItem(wallet._id)"
                      >Delete</a
                    >
                  </td>
                </tr>
              </ng-container>

              <ng-template #noProducts>
                <tr>
                  <td colspan="7" class="table-empty">No Wallet Available.</td>
                </tr>
              </ng-template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <button
    class="circle-btn btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#staticBackdrop"
  >
    +
  </button>
<!-- Add Modal -->
  <div
    class="modal fade"
    id="staticBackdrop"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    aria-labelledby="staticBackdropLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content smato-modal">
        <div class="modal-header">
          <h2 class="modal-title" id="staticBackdropLabel">
            Create Wallet
          </h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            placeholder="Customer Name"
            class="form-control smato-search mt-2"
            [(ngModel)]="customername"
          />
          <input
            type="number"
            placeholder="Outstanding Amount"
            class="form-control smato-search mt-2"
            [(ngModel)]="outstandingAmount"
          />

          <textarea
            name=""
            placeholder="Short note"
            id=""
            cols="30"
            rows="5"
            class="form-control smato-search mt-2"
            [(ngModel)]="short_note"
          ></textarea>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>
          <button
            type="button"
            class="btn btn-primary"
            data-bs-dismiss="modal"
            (click)="createWallet()"
            [disabled]="
              this.customername == '' ||
              this.outstandingAmount == '' ||
              this.short_note == ''
            "
          >
            Create
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- //edit -->
</div>
