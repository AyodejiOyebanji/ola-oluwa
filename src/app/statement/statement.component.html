  <div class="container-fluid pt-4 px-4">
    <div class="row g-4">
      <!-- All product Start -->
      <div class="container-fluid pt-4 px-4">
        <div class="smato-page-card">
          <div class="smato-page-header">
            <h1 class="smato-page-title">Account Statement</h1>
          </div>
          <input
            type="text"
            class="form-control m-2 ms-auto"
            style="width: 80%"
            placeholder="Search "
            (input)="search()"
            [(ngModel)]="searchQuery"
          />

          <div class="table-responsive mt-3">
            <table
              class="smato-table"
            >
              <thead>
                <tr>
                  <th scope="col">S/N</th>

                  <th scope="col">Account</th>
                  <th scope="col">Available Amount</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                <ng-container *ngIf="filteredAccounts?.length; else noProducts">
                  <tr *ngFor="let account of filteredAccounts; let i = index">
                    <td>{{ i + 1 }}</td>

                    <td>{{ account.title }}</td>
                    <td>₦{{ account.availableamount }}:00</td>
                    <td>
                        <a
                          class="btn btn-sm btn-primary w-100"
                          (click)="viewItem(account._id)"
                         
                          >View</a
                        >
                      </td>
                  </tr>
                </ng-container>

                <ng-template #noProducts>
                  <tr>
                    <td colspan="7" class="table-empty">No Account found.</td>
                  </tr>
                </ng-template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
