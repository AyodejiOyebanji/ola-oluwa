<div class="container-fluid pt-4 px-4">
  <div class="row g-4">








    <!-- All product Start -->
    <div class="container-fluid pt-4 px-4">
      <div class="bg-light rounded p-4">
        <div class="d-flex align-items-center justify-content-between mb-4">


        </div>

        <div class="table-responsive staff">
          <h1>Add Staff</h1>
          <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <mat-form-field class="example-full-width">
                <mat-label>Firstname</mat-label>
                <input matInput type="text" formControlName="fname">
              </mat-form-field>
            </div>
            <div class="form-group">
              <mat-form-field class="example-full-width">
                <mat-label>Lastname</mat-label>
                <input matInput type="text" formControlName="lname">
              </mat-form-field>
            </div>
            <div class="form-group">
              <mat-form-field class="example-full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email">
              </mat-form-field>
            </div>
            <div class="form-group">
              <mat-form-field class="example-full-width">
                <mat-label>Phone Number</mat-label>
                <input matInput type="number" formControlName="phone">
              </mat-form-field>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="row">
                  <div class="col-md-12 col-lg-4">
                    <mat-form-field class="example-full-width">
                      <mat-label>Account Name</mat-label>
                      <input matInput type="text" formControlName="acct_name">
                    </mat-form-field>
                  </div>
                  <div class="col-md-12 col-lg-4">
                    <mat-form-field class="example-full-width">
                      <mat-label>Account Number</mat-label>
                      <input matInput type="number" formControlName="acct_no">
                    </mat-form-field>
                  </div>
                  <div class="col-md-12 col-lg-4">
                    <mat-form-field class="example-full-width">
                      <mat-label>Bank Name</mat-label>
                      <input matInput type="text" formControlName="bankname">
                    </mat-form-field>
                  </div>

                </div>

              </div>

            </div>
            <mat-form-field appearance="fill" class="example-full-width">
              <mat-label>Role</mat-label>
              <mat-select formControlName="role" (selectionChange)="onRoleChange()">
                <mat-option value="Admin">Admin</mat-option>
                <mat-option value="Cashier">Cashier</mat-option>
                <mat-option value="Staff"> Staff</mat-option>
              </mat-select>
            </mat-form-field>
            <button mat-raised-button color="primary" type="submit">Add Staff</button>
          </form>

        </div>
      </div>
